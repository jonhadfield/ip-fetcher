name: goreleaser

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    name: Docker Build, Tag, Push
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    -
      name: Log in to ghcr
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    -
      name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    -
      if: startsWith(github.ref, 'refs/heads/master')
      run: echo "TAG=latest" >> $GITHUB_ENV

    -
      if: startsWith(github.ref, 'refs/tags')
      run: echo "TAG=$(git describe --tags)" >> $GITHUB_ENV

    -
      name: determine image tags
      # Only move :latest for final releases. A semver prerelease (v0.0.28-rc1)
      # contains a hyphen; a final release (v0.0.28) does not.
      run: |
        TAGS="${{ github.repository }}:${TAG},ghcr.io/${{ github.repository }}:${TAG}"
        if [[ "${{ github.ref_name }}" != *-* ]]; then
          TAGS="${TAGS},${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:latest"
        else
          echo "::notice::prerelease ${{ github.ref_name }} - not publishing :latest"
        fi
        echo "TAGS=${TAGS}" >> $GITHUB_ENV

    -
      name: build image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
#         context: ./docker
        file: ./Dockerfile
        build-args: TAG=${{ env.TAG }}
        push: false
        tags: ${{ env.TAGS }}

    - name: trivy image scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        # the versioned tag is always built; :latest is not, on prereleases
        image-ref: ${{ github.repository }}:${{ env.TAG }}
        exit-code: 0
        severity: UNKNOWN,LOW,MEDIUM

    -
      name: push image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
#         context: ./docker
        file: ./Dockerfile
        build-args: TAG=${{ env.TAG }}
        push: true
        tags: ${{ env.TAGS }}

  goreleaser:
    runs-on: ubuntu-latest
    name: GoReleaser
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # goreleaser needs the full history for the changelog

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean -f goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization. Absent secrets resolve to empty
          # strings, which disables the notarize step rather than failing it.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
