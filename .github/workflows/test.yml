name: test
on:
  push:
    tags:
      - '*'
    branches:
      - main
  pull_request:
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: go test
        run: go test -covermode=atomic -coverprofile=coverage.txt -timeout=600s ./...
      - name: coverage
        run: go tool cover -func=coverage.txt | tail -1
      # handed to the sonarqube job so the suite is not run twice per PR
      - name: upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.txt

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # go-version-input must be set explicitly: it defaults to "stable", and
      # setup-go prefers it over go-version-file, so the scan would otherwise
      # run against the newest Go rather than the release line this module
      # ships. Standard library findings depend on that version, so a pinned
      # but vulnerable toolchain would pass unnoticed.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.26'
          go-package: ./...

  # A separate job, not a step in `test`: SONAR_TOKEN is unavailable to
  # dependabot pull requests, so the scan fails on those. Keeping it apart
  # means that failure does not turn the test result red as well.
  sonarqube:
    name: SonarCloud
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      # SONAR_HOST_URL is not set: it is only required for a self hosted
      # SonarQube Server, not for SonarQube Cloud.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
