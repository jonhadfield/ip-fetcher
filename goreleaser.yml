version: 2

project_name: ip-fetcher

env:
  - GO111MODULE=on
  - GOPROXY=https://proxy.golang.org
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go mod tidy

builds:
  - id: ip-fetcher
    main: ./cmd/ip-fetcher/
    binary: ip-fetcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      # 32 bit arm is not a darwin or windows target
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.sha={{ .ShortCommit }} -X main.buildDate={{ .Date }} -X main.tag={{ .Tag }}"

# Sign and notarize the darwin binaries so macOS Gatekeeper does not warn on
# first run. Uses goreleaser's cross-platform (quill) implementation, which
# needs no macOS runner. The enabled guard keeps snapshot and fork builds
# working when the secrets are absent. Both the certificate and the notary key
# are required, since signing without usable notary credentials would fail the
# release outright: a half-configured state must stay disabled.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids:
        - ip-fetcher
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - ip-fetcher
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - none*


homebrew_casks:
  - name: ip-fetcher
    binaries: [ip-fetcher]
    repository:
      owner: jonhadfield
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jonhadfield/ip-fetcher
    description: A go library and CLI to fetch IP ranges from popular online sources
    # The darwin binaries are signed and notarized, but a notarization
    # ticket cannot be stapled into a bare Mach-O executable, so Gatekeeper
    # reports "Notary Ticket Missing" and blocks first run. Casks set the
    # quarantine flag on download, so clear it here.
    #
    # goreleaser's hooks.post.install emits a `postflight` block, which Homebrew
    # 7 deprecates in favour of `postflight_steps`, warning on every install and
    # update. That is not a rename: postflight_steps takes declarative steps
    # rather than arbitrary Ruby, so the body is rewritten and injected through
    # custom_block instead. Revert to hooks once goreleaser emits
    # postflight_steps itself.
    custom_block: |
      # staged_path is a Homebrew template token, not the Ruby method the
      # postflight block used, and goreleaser renders this through Go's
      # templating first, so the braces are escaped to survive it.
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/ip-fetcher"], must_succeed: false
      end
release:
  github:
    owner: jonhadfield
    name: ip-fetcher
  prerelease: auto
  name_template: '{{ .Tag }}'

announce:
  skip: true

snapshot:
  version_template: "{{ .Tag }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - README
      - test
      - ignore

checksum:
  name_template: 'checksums.txt'
